
name: Build GeoDrug APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare Android SDK
        run: |
          echo "Android SDK: $ANDROID_HOME"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unzip Android project
        run: |
          mkdir -p source
          ZIP=$(find . -maxdepth 1 -iname "*.zip" -type f | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "ZIP archive not found"
            exit 1
          fi
          unzip -q "$ZIP" -d source

      - name: Build APK
        run: |
          GRADLEW=$(find source -type f -name gradlew | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "gradlew not found in ZIP"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
          chmod +x "$GRADLEW"
          "$GRADLEW" -p "$PROJECT_DIR" assembleDebug

      - name: Save APK
        uses: actions/upload-artifact@v4
        with:
          name: GeoDrug-APK
          path: source/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
